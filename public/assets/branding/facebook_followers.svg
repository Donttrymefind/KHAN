<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_fb_f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#0A1128"/>
      <stop offset="50%" stopColor="#102A43"/>
      <stop offset="100%" stopColor="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg_fb_f)"/>
  
  <!-- Verified Badge -->
  <g transform="translate(24, 24)">
    <rect width="90" height="26" rx="6" fill="#1877F2" opacity="0.9"/>
    <text x="12" y="17" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF">OFFICIAL</text>
  </g>

  <!-- Big Official Facebook Logo -->
  <g transform="translate(150, 85)">
    <circle cx="50" cy="50" r="48" fill="#1877F2" filter="drop-shadow(0 12px 25px rgba(24,119,242,0.5))"/>
    <path d="M62 50h-8.5v30h-12V50h-6v-10h6v-7c0-8.5 5.2-13 12.8-13 3.6 0 7.4.6 7.4.6v8.2h-4.2c-4.2 0-5.5 2.6-5.5 5.3v5.9h9.3l-1.3 10z" fill="#FFFFFF"/>
  </g>

  <!-- Followers Counter Badge Overlay -->
  <g transform="translate(130, 185)">
    <rect width="140" height="30" rx="15" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.4))"/>
    <text x="70" y="20" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="12" fill="#38BDF8" text-anchor="middle">+1,000,000 FOLLOWERS</text>
  </g>

  <text x="200" y="248" font-family="Segoe UI, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">FACEBOOK FOLLOWERS</text>
  <text x="200" y="272" font-family="Segoe UI, sans-serif" font-weight="600" font-size="12" fill="#94A3B8" text-anchor="middle">১০০ থেকে ১০ লাখ ফলোয়ার</text>
