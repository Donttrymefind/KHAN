<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_fb_live" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#0B132B"/>
      <stop offset="50%" stopColor="#1C2541"/>
      <stop offset="100%" stopColor="#0F172A"/>
    </linearGradient>
    <radialGradient id="live_glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stopColor="#1877F2" stopOpacity="0.4"/>
      <stop offset="100%" stopColor="#1877F2" stopOpacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg_fb_live)"/>
  <rect width="400" height="300" fill="url(#live_glow)"/>
  
  <!-- Red LIVE Pulsing Badge -->
  <g transform="translate(24, 24)">
    <rect width="80" height="28" rx="6" fill="#EF4444" filter="drop-shadow(0 4px 10px rgba(239,68,68,0.5))"/>
    <circle cx="16" cy="14" r="5" fill="#FFFFFF"/>
    <text x="30" y="19" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" letter-spacing="1">LIVE</text>
  </g>

  <!-- Broadcast Waves -->
  <circle cx="200" cy="140" r="70" fill="none" stroke="#1877F2" stroke-width="2" opacity="0.3" stroke-dasharray="6 6"/>
  <circle cx="200" cy="140" r="85" fill="none" stroke="#1877F2" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Facebook Official Logo -->
  <g transform="translate(150, 90)">
    <circle cx="50" cy="50" r="48" fill="#1877F2" filter="drop-shadow(0 10px 25px rgba(24,119,242,0.5))"/>
    <path d="M62 50h-8.5v30h-12V50h-6v-10h6v-7c0-8.5 5.2-13 12.8-13 3.6 0 7.4.6 7.4.6v8.2h-4.2c-4.2 0-5.5 2.6-5.5 5.3v5.9h9.3l-1.3 10z" fill="#FFFFFF"/>
  </g>

  <!-- Text Heading -->
  <text x="200" y="235" font-family="Segoe UI, sans-serif" font-weight="900" font-size="19" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">FACEBOOK LIVE</text>
  <text x="200" y="262" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13" fill="#38BDF8" text-anchor="middle">লাইভ ভিউয়ার্স ও কমেন্টস</text>
</svg>