<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_fb_v" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#0B132B"/>
      <stop offset="60%" stopColor="#1E293B"/>
      <stop offset="100%" stopColor="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg_fb_v)"/>
  
  <!-- Big Official Facebook Logo -->
  <g transform="translate(150, 70)">
    <circle cx="50" cy="50" r="48" fill="#1877F2" filter="drop-shadow(0 12px 25px rgba(24,119,242,0.5))"/>
    <path d="M62 50h-8.5v30h-12V50h-6v-10h6v-7c0-8.5 5.2-13 12.8-13 3.6 0 7.4.6 7.4.6v8.2h-4.2c-4.2 0-5.5 2.6-5.5 5.3v5.9h9.3l-1.3 10z" fill="#FFFFFF"/>
  </g>

  <!-- Watch Time Badge -->
  <g transform="translate(115, 175)">
    <rect width="170" height="30" rx="8" fill="#10B981" filter="drop-shadow(0 4px 10px rgba(16,185,129,0.3))"/>
    <text x="85" y="20" font-family="Segoe UI, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">60,000 - 600,000 MINS</text>
  </g>

  <text x="200" y="235" font-family="Segoe UI, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">FB WATCH TIME &amp; VIEWS</text>
  <text x="200" y="260" font-family="Segoe UI, sans-serif" font-weight="700" font-size="12" fill="#34D399" text-anchor="middle">ভিডিও ভিউজ ও পেজ মনিটাইজেশন</text>
</svg>