<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="ff_dia_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#0B192C"/>
      <stop offset="50%" stopColor="#1E3E62"/>
      <stop offset="100%" stopColor="#000000"/>
    </linearGradient>
    <linearGradient id="dia_blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#67E8F9"/>
      <stop offset="50%" stopColor="#06B6D4"/>
      <stop offset="100%" stopColor="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#ff_dia_bg)"/>

  <!-- Glowing Diamonds Cluster -->
  <g transform="translate(150, 60)" filter="drop-shadow(0 15px 35px rgba(6,182,212,0.6))">
    <!-- Main Center Diamond -->
    <polygon points="50,15 85,45 50,95 15,45" fill="url(#dia_blue)"/>
    <polygon points="50,15 50,95 15,45" fill="#38BDF8" opacity="0.6"/>
    <polygon points="50,15 50,95 85,45" fill="#0284C7" opacity="0.8"/>
    <polygon points="30,45 50,15 70,45" fill="#CFFAFE" opacity="0.9"/>
  </g>
  <!-- Smaller Left Diamond -->
  <g transform="translate(90, 95)" filter="drop-shadow(0 8px 20px rgba(6,182,212,0.5))">
    <polygon points="25,8 42,24 25,50 8,24" fill="url(#dia_blue)"/>
  </g>
  <!-- Smaller Right Diamond -->
  <g transform="translate(260, 95)" filter="drop-shadow(0 8px 20px rgba(6,182,212,0.5))">
    <polygon points="25,8 42,24 25,50 8,24" fill="url(#dia_blue)"/>
  </g>

  <!-- Title Badge -->
  <text x="200" y="205" font-family="Arial Black, Orbitron, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">UID TOPUP (BD)</text>
  <text x="200" y="235" font-family="Segoe UI, sans-serif" font-weight="900" font-size="16" fill="#38BDF8" text-anchor="middle">২৫💎 (১৮ ৳) থেকে ১২,০০০💎</text>
  <text x="200" y="262" font-family="Segoe UI, sans-serif" font-weight="700" font-size="12" fill="#E2E8F0" text-anchor="middle">২ সেকেন্ডে সরাসরি গেম আইডিতে ডেলিভারি</text>
</svg>