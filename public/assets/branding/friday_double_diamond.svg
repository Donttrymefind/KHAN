<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="friday_bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- AI Cyber Neon Gradients -->
    <linearGradient id="cyber_cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="cyber_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="badge_blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="friday_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="cyber_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#friday_bg)"/>

  <!-- AI Circuit Grid Matrix in Background -->
  <g stroke="#38BDF8" stroke-width="0.8" opacity="0.25">
    <path d="M40 0 L40 300 M80 0 L80 300 M120 0 L120 300 M160 0 L160 300 M200 0 L200 300 M240 0 L240 300 M280 0 L280 300 M320 0 L320 300 M360 0 L360 300"/>
    <path d="M0 40 L400 40 M0 80 L400 80 M0 120 L400 120 M0 160 L400 160 M0 200 L400 200"/>
    <!-- Circuit nodes -->
    <circle cx="80" cy="80" r="2.5" fill="#38BDF8"/>
    <circle cx="160" cy="120" r="2.5" fill="#38BDF8"/>
    <circle cx="240" cy="120" r="2.5" fill="#38BDF8"/>
    <circle cx="320" cy="80" r="2.5" fill="#38BDF8"/>
  </g>

  <!-- Neon Flare Beams -->
  <g opacity="0.4">
    <polygon points="200,105 130,0 170,0" fill="#67E8F9"/>
    <polygon points="200,105 185,0 215,0" fill="#FDE047"/>
    <polygon points="200,105 230,0 270,0" fill="#67E8F9"/>
  </g>

  <!-- Giant "2X" Cyber Emblem Center -->
  <g transform="translate(200, 95)" filter="url(#friday_shadow)">
    <!-- Aura Ring -->
    <circle cx="0" cy="0" r="62" fill="#1E1B4B" stroke="#0066FF" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="54" fill="#0F172A" stroke="#38BDF8" stroke-dasharray="6,4" stroke-width="1.8"/>

    <!-- Left Diamond (Cyan AI) -->
    <g transform="translate(-24, -5) scale(0.7)" filter="url(#cyber_glow)">
      <polygon points="0,-25 22,-10 0,0 -22,-10" fill="#BAE6FD" stroke="#FFFFFF" stroke-width="1.5"/>
      <polygon points="-22,-10 0,0 0,30 -18,10" fill="url(#cyber_cyan)" stroke="#E0F2FE" stroke-width="1.2"/>
      <polygon points="22,-10 0,0 0,30 18,10" fill="#0284C7" stroke="#E0F2FE" stroke-width="1.2"/>
    </g>

    <!-- Right Diamond (Golden AI) -->
    <g transform="translate(24, -5) scale(0.7)" filter="url(#cyber_glow)">
      <polygon points="0,-25 22,-10 0,0 -22,-10" fill="#FEF08A" stroke="#FFFFFF" stroke-width="1.5"/>
      <polygon points="-22,-10 0,0 0,30 -18,10" fill="url(#cyber_gold)" stroke="#FFFBEB" stroke-width="1.2"/>
      <polygon points="22,-10 0,0 0,30 18,10" fill="#B45309" stroke="#FFFBEB" stroke-width="1.2"/>
    </g>

    <!-- Prominent "2X" Badge Overlay -->
    <g transform="translate(0, 16)" filter="url(#cyber_glow)">
      <rect x="-35" y="-14" width="70" height="26" rx="13" fill="#EF4444" stroke="#FDE047" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
        2X DOUBLE
      </text>
    </g>
  </g>

  <!-- Top Cyber Ribbon: FRIDAY SPECIAL -->
  <g transform="translate(100, 20)" filter="url(#friday_shadow)">
    <rect width="200" height="26" rx="13" fill="#0066FF" stroke="#67E8F9" stroke-width="1.5"/>
    <text x="100" y="18" font-family="Arial Black, Orbitron, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      ⚡ AI FRIDAY SPECIAL ⚡
    </text>
  </g>

  <!-- Bottom Title Badge -->
  <g transform="translate(30, 186)" filter="url(#friday_shadow)">
    <rect width="340" height="42" rx="21" fill="url(#badge_blue)" stroke="#67E8F9" stroke-width="2"/>
    <text x="170" y="27" font-family="Arial Black, Orbitron, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      FRIDAY DOUBLE <tspan fill="#FDE047">DIAMOND 2X</tspan>
    </text>
  </g>

  <!-- Subtitles -->
  <text x="200" y="255" font-family="Segoe UI, Hind Siliguri, sans-serif" font-weight="900" font-size="14" fill="#67E8F9" text-anchor="middle">
    ডাবল বোনাস অফার (১৬টি প্যাকেজ)
  </text>
  <text x="200" y="278" font-family="Segoe UI, Hind Siliguri, sans-serif" font-weight="700" font-size="12" fill="#FDE047" text-anchor="middle">
    প্রতি শুক্রবার ডাবল ডায়মন্ড ক্রেডিট
  </text>
</svg>
