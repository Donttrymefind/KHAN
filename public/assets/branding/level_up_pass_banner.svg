<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="lup_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#431407"/>
      <stop offset="50%" stopColor="#9A3412"/>
      <stop offset="100%" stopColor="#0F172A"/>
    </linearGradient>
    <linearGradient id="lup_fire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#F59E0B"/>
      <stop offset="100%" stopColor="#DC2626"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#lup_bg)"/>

  <!-- Golden 802💎 Badge -->
  <g transform="translate(130, 55)" filter="drop-shadow(0 15px 30px rgba(245,158,11,0.5))">
    <rect width="140" height="110" rx="16" fill="url(#lup_fire)" stroke="#FDE68A" stroke-width="2.5"/>
    <text x="70" y="32" font-family="Arial Black, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">LEVEL 2-30</text>
    <text x="70" y="68" font-family="Arial Black, sans-serif" font-weight="900" font-size="28" fill="#FEF08A" text-anchor="middle">802💎</text>
    <text x="70" y="95" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF" text-anchor="middle">মাত্র ১৬০ ৳</text>
  </g>

  <text x="200" y="205" font-family="Arial Black, Orbitron, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">NEW LEVEL UP PASS</text>
  <text x="200" y="235" font-family="Segoe UI, sans-serif" font-weight="900" font-size="15" fill="#FBBF24" text-anchor="middle">লেভেল আপ পাস (৮০২ ডায়মন্ড)</text>
  <text x="200" y="260" font-family="Segoe UI, sans-serif" font-weight="600" font-size="12" fill="#E2E8F0" text-anchor="middle">সিঙ্গেল ও কম্বো প্যাক সহ ১৫টি অপশন</text>
</svg>