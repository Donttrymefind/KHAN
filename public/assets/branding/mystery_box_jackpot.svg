<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="jackpot_rad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#701A75"/>
      <stop offset="45%" stop-color="#4A044E"/>
      <stop offset="100%" stop-color="#140217"/>
    </radialGradient>

    <!-- Jackpot Gold & Magenta Gradients -->
    <linearGradient id="neon_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="neon_magenta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <linearGradient id="diamond_cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="jackpot_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="neon_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#jackpot_rad)"/>

  <!-- Radial Neon Rays -->
  <g opacity="0.35">
    <polygon points="200,120 120,0 170,0" fill="#F43F5E"/>
    <polygon points="200,120 185,0 215,0" fill="#FDE047"/>
    <polygon points="200,120 230,0 280,0" fill="#F43F5E"/>
    <polygon points="200,120 330,40 370,80" fill="#FDE047"/>
    <polygon points="200,120 30,80 70,40" fill="#FDE047"/>
  </g>

  <!-- Flashing Marquee Bulbs Top Arch -->
  <g fill="#FDE047" filter="url(#neon_glow)">
    <circle cx="80" cy="35" r="4.5"/>
    <circle cx="120" cy="22" r="4.5"/>
    <circle cx="160" cy="16" r="4.5"/>
    <circle cx="200" cy="14" r="5.5" fill="#FFFFFF"/>
    <circle cx="240" cy="16" r="4.5"/>
    <circle cx="280" cy="22" r="4.5"/>
    <circle cx="320" cy="35" r="4.5"/>
  </g>

  <!-- Overflowing Cyan Diamonds & Gold Coins -->
  <g filter="url(#neon_glow)">
    <!-- Cyan Diamond Left -->
    <polygon points="105,95 125,75 145,95 125,115" fill="url(#diamond_cyan)" stroke="#E0F2FE" stroke-width="1.5"/>
    <!-- Cyan Diamond Right -->
    <polygon points="255,95 275,75 295,95 275,115" fill="url(#diamond_cyan)" stroke="#E0F2FE" stroke-width="1.5"/>
    <!-- Large Center Diamond -->
    <polygon points="200,50 225,75 200,105 175,75" fill="url(#diamond_cyan)" stroke="#FFFFFF" stroke-width="2"/>
    <polygon points="175,75 200,65 225,75 200,85" fill="#BAE6FD" opacity="0.8"/>
  </g>

  <!-- Gold Coins Stacks -->
  <g fill="#FBBF24" stroke="#D97706" stroke-width="1.5">
    <ellipse cx="140" cy="120" rx="14" ry="7"/>
    <ellipse cx="140" cy="115" rx="14" ry="7"/>
    <ellipse cx="260" cy="120" rx="14" ry="7"/>
    <ellipse cx="260" cy="115" rx="14" ry="7"/>
  </g>

  <!-- Open Jackpot Chest Body -->
  <g transform="translate(130, 80)" filter="url(#jackpot_shadow)">
    <!-- Base Box -->
    <rect x="15" y="35" width="110" height="60" rx="8" fill="url(#neon_gold)" stroke="#FEF08A" stroke-width="2.5"/>
    <!-- Neon Magenta Inset -->
    <rect x="25" y="45" width="90" height="40" rx="6" fill="#4A044E" stroke="#F43F5E" stroke-width="2"/>
    
    <text x="70" y="65" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="14" fill="#FEF08A" text-anchor="middle" letter-spacing="1">
      JACKPOT
    </text>
    <text x="70" y="80" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="12" fill="#38BDF8" text-anchor="middle" filter="url(#neon_glow)">
      💎 10,000 💎
    </text>
  </g>

  <!-- Giant "MEGA JACKPOT" Banner -->
  <g transform="translate(35, 184)" filter="url(#jackpot_shadow)">
    <rect width="330" height="44" rx="22" fill="url(#neon_magenta)" stroke="#FDE047" stroke-width="2.5"/>
    <text x="165" y="28" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      MEGA JACKPOT <tspan fill="#FDE047">বক্স</tspan>
    </text>
  </g>

  <!-- Subtitles -->
  <text x="200" y="255" font-family="Segoe UI, Hind Siliguri, sans-serif" font-weight="900" font-size="14" fill="#FDE047" text-anchor="middle">
    💎 সর্বোচ্চ ১০,০০০ ডায়মন্ড উইন চান্স
  </text>
  <text x="200" y="278" font-family="Segoe UI, Hind Siliguri, sans-serif" font-weight="700" font-size="12" fill="#F472B6" text-anchor="middle">
    আল্ট্রা ভল্ট জ্যাকপট মেগা ড্রপ বক্স
  </text>
</svg>
