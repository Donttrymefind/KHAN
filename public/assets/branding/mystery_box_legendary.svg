<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="legend_rad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="45%" stop-color="#450A0A"/>
      <stop offset="100%" stop-color="#1A0202"/>
    </radialGradient>

    <!-- Molten Gold & Fire Gradients -->
    <linearGradient id="fire_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="35%" stop-color="#F97316"/>
      <stop offset="70%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>

    <linearGradient id="legend_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="fire_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="fire_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#legend_rad)"/>

  <!-- Blazing Background Flares -->
  <g opacity="0.35">
    <polygon points="200,120 110,0 160,0" fill="#EF4444"/>
    <polygon points="200,120 180,0 220,0" fill="#FDE047"/>
    <polygon points="200,120 240,0 290,0" fill="#EF4444"/>
    <polygon points="200,120 350,50 390,90" fill="#F97316"/>
    <polygon points="200,120 10,90 50,50" fill="#F97316"/>
  </g>

  <!-- Blazing Phoenix / Dragon Wings Behind Chest -->
  <g filter="url(#fire_glow)" opacity="0.9">
    <!-- Left Wing -->
    <path d="M140 105 C110 70 70 65 30 90 C60 110 90 120 135 125 Z" fill="url(#fire_grad)"/>
    <path d="M140 95 C110 50 60 45 40 60 C70 80 100 100 135 110 Z" fill="url(#fire_grad)"/>
    <path d="M140 85 C120 30 80 25 65 35 C90 60 120 80 135 95 Z" fill="#FDE047"/>

    <!-- Right Wing -->
    <path d="M260 105 C290 70 330 65 370 90 C340 110 310 120 265 125 Z" fill="url(#fire_grad)"/>
    <path d="M260 95 C290 50 340 45 360 60 C330 80 300 100 265 110 Z" fill="url(#fire_grad)"/>
    <path d="M260 85 C280 30 320 25 335 35 C310 60 280 80 265 95 Z" fill="#FDE047"/>
  </g>

  <!-- Floating Fiery Embers -->
  <g fill="#FDE047" opacity="0.85">
    <circle cx="100" cy="50" r="3.5"/>
    <circle cx="120" cy="35" r="2.5"/>
    <circle cx="280" cy="40" r="3"/>
    <circle cx="300" cy="55" r="2.5"/>
    <path d="M200 45 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3 z" fill="#FFFBEB" filter="url(#fire_glow)"/>
  </g>

  <!-- Armored Dragon / Phoenix Chest Body -->
  <g transform="translate(130, 65)" filter="url(#fire_shadow)">
    <!-- Base Chest Body -->
    <rect x="15" y="45" width="110" height="68" rx="8" fill="url(#fire_grad)" stroke="#FEF08A" stroke-width="2.5"/>

    <!-- Lid Rim with Spikes -->
    <path d="M10 40 Q70 28 130 40 L132 50 Q70 38 8 50 Z" fill="url(#legend_gold)" stroke="#FDE047" stroke-width="2"/>

    <!-- Fiery Dragon Crest Plate Center -->
    <rect x="52" y="46" width="36" height="40" rx="8" fill="#450A0A" stroke="#FDE047" stroke-width="2"/>
    <!-- Fire Flame / Dragon Claw Icon -->
    <path d="M70 54 C74 58 78 63 76 68 C74 72 66 72 64 68 C62 65 64 60 68 56 C68 56 66 61 68 64 C70 66 73 65 73 62 C73 59 71 56 70 54 Z" fill="#FDE047" filter="url(#fire_glow)"/>
    <text x="70" y="80" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="10" fill="#FEF08A" text-anchor="middle">EVO</text>

    <!-- Heavy Armor Corner Brackets -->
    <rect x="18" y="48" width="16" height="62" rx="4" fill="url(#legend_gold)"/>
    <rect x="106" y="48" width="16" height="62" rx="4" fill="url(#legend_gold)"/>
    <circle cx="26" cy="56" r="2.5" fill="#450A0A"/>
    <circle cx="26" cy="98" r="2.5" fill="#450A0A"/>
    <circle cx="114" cy="56" r="2.5" fill="#450A0A"/>
    <circle cx="114" cy="98" r="2.5" fill="#450A0A"/>
  </g>

  <!-- Bottom Title Badge -->
  <g transform="translate(35, 186)" filter="url(#fire_shadow)">
    <rect width="330" height="42" rx="21" fill="#450A0A" stroke="#EF4444" stroke-width="2.5"/>
    <text x="165" y="27" font-family="Arial Black, Orbitron, sans-serif" font-weight="900" font-size="17" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      LEGENDARY <tspan fill="#F59E0B">মিষ্টি বক্স</tspan>
    </text>
  </g>

  <!-- Subtitles -->
  <text x="200" y="255" font-family="Segoe UI, Hind Siliguri, sans-serif" font-weight="900" font-size="14" fill="#FDE047" text-anchor="middle">
    🔥 রেয়ার ইমোট ও ড্রাগন বান্ডেল ক্রাফট
  </text>
  <text x="200" y="278" font-family="Segoe UI, Hind Siliguri, sans-serif" font-weight="700" font-size="12" fill="#FCA5A5" text-anchor="middle">
    ১০০০-২৫০০💎 ডায়মন্ড ও মিথিক আইটেম
  </text>
</svg>
