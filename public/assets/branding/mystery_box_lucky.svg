<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="lucky_rad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="45%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </radialGradient>

    <!-- Emerald & Gold Gradients -->
    <linearGradient id="emerald_chest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <linearGradient id="lucky_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="lucky_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="lucky_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#lucky_rad)"/>

  <!-- Emerald Light Rays -->
  <g opacity="0.3">
    <polygon points="200,120 100,0 150,0" fill="#6EE7B7"/>
    <polygon points="200,120 180,0 220,0" fill="#FDE047"/>
    <polygon points="200,120 250,0 300,0" fill="#6EE7B7"/>
    <polygon points="200,120 340,50 380,90" fill="#FACC15"/>
    <polygon points="200,120 20,90 60,50" fill="#FACC15"/>
  </g>

  <!-- Lucky Clovers floating -->
  <g fill="#34D399" opacity="0.75" filter="url(#lucky_glow)">
    <!-- Clover Left -->
    <g transform="translate(65, 60) scale(0.9)">
      <circle cx="10" cy="5" r="7"/>
      <circle cx="5" cy="12" r="7"/>
      <circle cx="15" cy="12" r="7"/>
      <circle cx="10" cy="18" r="7"/>
      <path d="M10 18 Q12 28 8 32" stroke="#059669" stroke-width="2.5" fill="none"/>
    </g>
    <!-- Clover Right -->
    <g transform="translate(305, 55) scale(0.9)">
      <circle cx="10" cy="5" r="7"/>
      <circle cx="5" cy="12" r="7"/>
      <circle cx="15" cy="12" r="7"/>
      <circle cx="10" cy="18" r="7"/>
      <path d="M10 18 Q8 28 12 32" stroke="#059669" stroke-width="2.5" fill="none"/>
    </g>
  </g>

  <!-- Golden 777 Lucky Sparkles -->
  <g fill="#FDE047" opacity="0.9">
    <path d="M110 55 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3 z"/>
    <path d="M280 45 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3 z"/>
  </g>

  <!-- Lucky Mystery Box Chest -->
  <g transform="translate(130, 65)" filter="url(#lucky_shadow)">
    <!-- Chest Body Front -->
    <rect x="15" y="45" width="110" height="68" rx="8" fill="url(#emerald_chest)" stroke="#FACC15" stroke-width="2.5"/>

    <!-- Chest Lid Rim -->
    <path d="M10 40 Q70 28 130 40 L132 50 Q70 38 8 50 Z" fill="url(#lucky_gold)" stroke="#FEF08A" stroke-width="2"/>

    <!-- Gold Corner Brackets -->
    <rect x="18" y="48" width="16" height="62" rx="4" fill="url(#lucky_gold)"/>
    <rect x="106" y="48" width="16" height="62" rx="4" fill="url(#lucky_gold)"/>
    <circle cx="26" cy="56" r="2.5" fill="#064E3B"/>
    <circle cx="26" cy="98" r="2.5" fill="#064E3B"/>
    <circle cx="114" cy="56" r="2.5" fill="#064E3B"/>
    <circle cx="114" cy="98" r="2.5" fill="#064E3B"/>

    <!-- Center Lucky Emblem Plate: 777 + Clover -->
    <rect x="52" y="47" width="36" height="38" rx="8" fill="#022C22" stroke="#FDE047" stroke-width="2.2"/>
    <text x="70" y="66" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="14" fill="#34D399" text-anchor="middle">LUCKY</text>
    <text x="70" y="80" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="13" fill="#FDE047" text-anchor="middle" filter="url(#lucky_glow)">777</text>
  </g>

  <!-- Crown on Top of Box -->
  <g transform="translate(182, 45)" filter="url(#lucky_glow)">
    <path d="M4 22 L8 8 L18 16 L28 6 L38 16 L48 8 L52 22 Z" fill="url(#lucky_gold)" stroke="#FEF08A" stroke-width="1.5"/>
    <circle cx="8" cy="8" r="2.5" fill="#34D399"/>
    <circle cx="28" cy="6" r="3" fill="#67E8F9"/>
    <circle cx="48" cy="8" r="2.5" fill="#34D399"/>
  </g>

  <!-- Bottom Title Badge -->
  <g transform="translate(40, 186)" filter="url(#lucky_shadow)">
    <rect width="320" height="42" rx="21" fill="#064E3B" stroke="#34D399" stroke-width="2"/>
    <text x="160" y="27" font-family="Arial Black, Orbitron, sans-serif" font-weight="900" font-size="17" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      LUCKY <tspan fill="#FACC15">মিষ্টি বক্স</tspan>
    </text>
  </g>

  <!-- Subtitles -->
  <text x="200" y="255" font-family="Segoe UI, Hind Siliguri, sans-serif" font-weight="900" font-size="14" fill="#6EE7B7" text-anchor="middle">
    👑 VIP লাকি ড্রপ • ইভো গান টোকেন
  </text>
  <text x="200" y="278" font-family="Segoe UI, Hind Siliguri, sans-serif" font-weight="700" font-size="12" fill="#FDE047" text-anchor="middle">
    ১০০% নিশ্চিত ইভো টোকেন ও রিওয়ার্ড
  </text>
</svg>
