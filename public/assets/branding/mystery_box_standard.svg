<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="mb_rad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="45%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090A1A"/>
    </radialGradient>

    <!-- Golden Chest Gradients -->
    <linearGradient id="gold_chest_front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="gold_chest_lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="cyan_glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadow_heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="glow_gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#mb_rad)"/>

  <!-- Light Beams from Box -->
  <g opacity="0.35">
    <polygon points="200,120 120,0 160,0" fill="#FDE047"/>
    <polygon points="200,120 180,0 220,0" fill="#67E8F9"/>
    <polygon points="200,120 240,0 280,0" fill="#FDE047"/>
    <polygon points="200,120 320,30 360,70" fill="#A855F7"/>
    <polygon points="200,120 40,70 80,30" fill="#A855F7"/>
  </g>

  <!-- Glowing Aura Back -->
  <circle cx="200" cy="125" r="75" fill="#F59E0B" opacity="0.25" filter="url(#glow_gold)"/>
  <circle cx="200" cy="125" r="45" fill="#67E8F9" opacity="0.2" filter="url(#glow_gold)"/>

  <!-- Sparkling Stars & Diamonds in Air -->
  <g fill="#FDE047" opacity="0.9">
    <path d="M90 60 l4 8 l8 4 l-8 4 l-4 8 l-4 -8 l-8 -4 l8 -4 z"/>
    <path d="M310 50 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3 z"/>
    <path d="M75 140 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z"/>
    <path d="M325 130 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3 z"/>
  </g>
  <g fill="#38BDF8" opacity="0.85">
    <!-- Floating mini diamond -->
    <polygon points="120,80 128,70 136,80 128,94" stroke="#E0F2FE" stroke-width="1"/>
    <polygon points="280,85 288,75 296,85 288,99" stroke="#E0F2FE" stroke-width="1"/>
  </g>

  <!-- 3D Mystery Chest -->
  <g transform="translate(130, 65)" filter="url(#shadow_heavy)">
    <!-- Back Lid Inside Glow -->
    <path d="M10 35 L70 12 L130 35 L70 50 Z" fill="#3B82F6" opacity="0.6"/>

    <!-- Chest Body Front -->
    <rect x="15" y="45" width="110" height="68" rx="8" fill="url(#gold_chest_front)" stroke="#FEF08A" stroke-width="2.5"/>

    <!-- Chest Lid Rim -->
    <path d="M10 40 Q70 28 130 40 L132 50 Q70 38 8 50 Z" fill="url(#gold_chest_lid)" stroke="#FDE047" stroke-width="2"/>

    <!-- Corner Plates & Rivets -->
    <rect x="18" y="48" width="16" height="62" rx="4" fill="#B45309" stroke="#FDE047" stroke-width="1.2"/>
    <rect x="106" y="48" width="16" height="62" rx="4" fill="#B45309" stroke="#FDE047" stroke-width="1.2"/>
    <circle cx="26" cy="56" r="2.5" fill="#FEF08A"/>
    <circle cx="26" cy="98" r="2.5" fill="#FEF08A"/>
    <circle cx="114" cy="56" r="2.5" fill="#FEF08A"/>
    <circle cx="114" cy="98" r="2.5" fill="#FEF08A"/>

    <!-- Center Lock Plate -->
    <rect x="55" y="48" width="30" height="36" rx="6" fill="#1E1B4B" stroke="#FDE047" stroke-width="2"/>
    
    <!-- Big Glowing Mystery Question Mark -->
    <text x="70" y="74" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="24" fill="#FDE047" text-anchor="middle" filter="url(#glow_gold)">?</text>
  </g>

  <!-- Bottom Badge Banner -->
  <g transform="translate(45, 186)" filter="url(#shadow_heavy)">
    <rect width="310" height="42" rx="21" fill="#1E1B4B" stroke="#F59E0B" stroke-width="2"/>
    <text x="155" y="27" font-family="Arial Black, Orbitron, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      MYSTERY <tspan fill="#F59E0B">বক্স</tspan>
    </text>
  </g>

  <!-- Subtitle Tag -->
  <text x="200" y="255" font-family="Segoe UI, Hind Siliguri, sans-serif" font-weight="900" font-size="14" fill="#FDE047" text-anchor="middle">
    ১০০% গ্যারান্টিড ড্রপ • ১৫টি অপশন
  </text>
  <text x="200" y="278" font-family="Segoe UI, Hind Siliguri, sans-serif" font-weight="700" font-size="12" fill="#93C5FD" text-anchor="middle">
    ডায়মন্ড ও আনলক রেয়ার আইটেম নিশ্চিত
  </text>
</svg>
