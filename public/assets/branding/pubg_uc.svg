<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="pubg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#18181B"/>
      <stop offset="50%" stopColor="#27272A"/>
      <stop offset="100%" stopColor="#09090B"/>
    </linearGradient>
    <linearGradient id="gold_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FDE047"/>
      <stop offset="50%" stopColor="#EAB308"/>
      <stop offset="100%" stopColor="#CA8A04"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#pubg_bg)"/>
  
  <!-- Metallic Orange Badge -->
  <g transform="translate(24, 24)">
    <rect width="100" height="26" rx="6" fill="#F97316"/>
    <text x="14" y="17" font-family="Arial Black, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF">PUBG MOBILE</text>
  </g>

  <!-- Big Golden UC Emblem -->
  <g transform="translate(150, 75)">
    <circle cx="50" cy="50" r="48" fill="url(#gold_grad)" filter="drop-shadow(0 12px 30px rgba(234,179,8,0.5))"/>
    <circle cx="50" cy="50" r="42" fill="#18181B"/>
    <text x="50" y="60" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="34" fill="url(#gold_grad)" text-anchor="middle" letter-spacing="2">UC</text>
  </g>

  <text x="200" y="215" font-family="Arial Black, sans-serif" font-weight="900" font-size="22" fill="#FDE047" text-anchor="middle" letter-spacing="1">PUBG MOBILE UC</text>
  <text x="200" y="242" font-family="Segoe UI, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">৬০ থেকে ১৬,২০০ UC ইনস্ট্যান্ট টপআপ</text>
  <text x="200" y="265" font-family="Segoe UI, sans-serif" font-weight="600" font-size="11" fill="#F97316" text-anchor="middle">Royale Pass &amp; Mythic Forge Pack</text>
</svg>