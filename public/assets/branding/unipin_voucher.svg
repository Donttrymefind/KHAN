<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="uni_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#0B132B"/>
      <stop offset="50%" stopColor="#1C2541"/>
      <stop offset="100%" stopColor="#0F172A"/>
    </linearGradient>
    <linearGradient id="uni_blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#0066FF"/>
      <stop offset="100%" stopColor="#00B4D8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#uni_bg)"/>

  <!-- UniPin Voucher Card -->
  <g transform="translate(120, 60)" filter="drop-shadow(0 15px 30px rgba(0,102,255,0.4))">
    <rect width="160" height="105" rx="14" fill="url(#uni_blue)" stroke="#7DD3FC" stroke-width="2"/>
    <text x="80" y="38" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">UNIPIN</text>
    <!-- Diamonds cluster inside card -->
    <polygon points="80,50 95,65 80,85 65,65" fill="#FFFFFF"/>
    <polygon points="55,60 65,70 55,85 45,70" fill="#E0F2FE" opacity="0.8"/>
    <polygon points="105,60 115,70 105,85 95,70" fill="#E0F2FE" opacity="0.8"/>
  </g>

  <text x="200" y="205" font-family="Arial Black, Orbitron, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">UNIPIN VOUCHER (BD)</text>
  <text x="200" y="235" font-family="Segoe UI, sans-serif" font-weight="900" font-size="15" fill="#38BDF8" text-anchor="middle">ইউনিপিন ডায়মন্ড ভাউচার কোড</text>
  <text x="200" y="260" font-family="Segoe UI, sans-serif" font-weight="600" font-size="12" fill="#E2E8F0" text-anchor="middle">২৫💎 থেকে ৫০৬০💎 পর্যন্ত ভাউচার</text>
</svg>