<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Radial Background -->
    <radialGradient id="spin_bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="45%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090A1A"/>
    </radialGradient>

    <linearGradient id="gold_wheel_rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="pointer_gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>

    <!-- Drop Shadows & Glow -->
    <filter id="spin_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="gold_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#spin_bg)"/>

  <!-- Light Flares -->
  <g opacity="0.3">
    <polygon points="200,105 120,0 160,0" fill="#A855F7"/>
    <polygon points="200,105 185,0 215,0" fill="#FDE047"/>
    <polygon points="200,105 240,0 280,0" fill="#38BDF8"/>
  </g>

  <!-- The Lucky Spin Wheel Component -->
  <g transform="translate(200, 105)" filter="url(#spin_shadow)">
    <!-- Outer Golden Wheel Rim -->
    <circle cx="0" cy="0" r="74" fill="url(#gold_wheel_rim)" stroke="#FDE047" stroke-width="2"/>
    <circle cx="0" cy="0" r="68" fill="#1E1B4B" stroke="#0F172A" stroke-width="2"/>

    <!-- Light Bulbs on Outer Rim (12 bulbs) -->
    <g fill="#FFFFFF" filter="url(#gold_glow)">
      <circle cx="0" cy="-71" r="2.5"/>
      <circle cx="35" cy="-61" r="2.5" fill="#FDE047"/>
      <circle cx="61" cy="-35" r="2.5"/>
      <circle cx="71" cy="0" r="2.5" fill="#FDE047"/>
      <circle cx="61" cy="35" r="2.5"/>
      <circle cx="35" cy="61" r="2.5" fill="#FDE047"/>
      <circle cx="0" cy="71" r="2.5"/>
      <circle cx="-35" cy="61" r="2.5" fill="#FDE047"/>
      <circle cx="-61" cy="35" r="2.5"/>
      <circle cx="-71" cy="0" r="2.5" fill="#FDE047"/>
      <circle cx="-61" cy="-35" r="2.5"/>
      <circle cx="-35" cy="-61" r="2.5" fill="#FDE047"/>
    </g>

    <!-- 8 Distinct Colored Segments of the Wheel (r=67) -->
    <!-- Segment 1 (Top right): Red 8000💎 Jackpot -->
    <path d="M 0 0 L 0 -67 A 67 67 0 0 1 47.37 -47.37 Z" fill="#EF4444" stroke="#FEF08A" stroke-width="1"/>
    <!-- Segment 2: Blue 500💎 -->
    <path d="M 0 0 L 47.37 -47.37 A 67 67 0 0 1 67 0 Z" fill="#0284C7" stroke="#FEF08A" stroke-width="1"/>
    <!-- Segment 3: Green 1500💎 -->
    <path d="M 0 0 L 67 0 A 67 67 0 0 1 47.37 47.37 Z" fill="#059669" stroke="#FEF08A" stroke-width="1"/>
    <!-- Segment 4: Amber 3000💎 -->
    <path d="M 0 0 L 47.37 47.37 A 67 67 0 0 1 0 67 Z" fill="#D97706" stroke="#FEF08A" stroke-width="1"/>
    <!-- Segment 5: Purple 1000💎 -->
    <path d="M 0 0 L 0 67 A 67 67 0 0 1 -47.37 47.37 Z" fill="#7C3AED" stroke="#FEF08A" stroke-width="1"/>
    <!-- Segment 6: Cyan 2000💎 -->
    <path d="M 0 0 L -47.37 47.37 A 67 67 0 0 1 -67 0 Z" fill="#06B6D4" stroke="#FEF08A" stroke-width="1"/>
    <!-- Segment 7: Pink 5000💎 -->
    <path d="M 0 0 L -67 0 A 67 67 0 0 1 -47.37 -47.37 Z" fill="#DB2777" stroke="#FEF08A" stroke-width="1"/>
    <!-- Segment 8 (Top left): Gold 2X VIP -->
    <path d="M 0 0 L -47.37 -47.37 A 67 67 0 0 1 0 -67 Z" fill="#EAB308" stroke="#FEF08A" stroke-width="1"/>

    <!-- Segment Text Labels -->
    <!-- 8000💎 Label -->
    <text transform="translate(18, -42) rotate(22)" font-family="Arial Black, Impact" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">8000💎</text>
    <!-- 500💎 Label -->
    <text transform="translate(45, -18) rotate(67)" font-family="Arial Black, Impact" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">500💎</text>
    <!-- 1500💎 Label -->
    <text transform="translate(45, 18) rotate(112)" font-family="Arial Black, Impact" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">1500💎</text>
    <!-- 3000💎 Label -->
    <text transform="translate(18, 45) rotate(157)" font-family="Arial Black, Impact" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">3000💎</text>
    <!-- 1000💎 Label -->
    <text transform="translate(-18, 45) rotate(-157)" font-family="Arial Black, Impact" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">1000💎</text>
    <!-- 2000💎 Label -->
    <text transform="translate(-45, 18) rotate(-112)" font-family="Arial Black, Impact" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">2000💎</text>
    <!-- 5000💎 Label -->
    <text transform="translate(-45, -18) rotate(-67)" font-family="Arial Black, Impact" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">5000💎</text>
    <!-- 2X VIP Label -->
    <text transform="translate(-18, -42) rotate(-22)" font-family="Arial Black, Impact" font-size="8.5" font-weight="900" fill="#000000" text-anchor="middle">2X VIP</text>

    <!-- Center Spin Hub Button -->
    <circle cx="0" cy="0" r="22" fill="url(#gold_wheel_rim)" stroke="#FEF08A" stroke-width="2"/>
    <circle cx="0" cy="0" r="17" fill="#1E1B4B"/>
    <text x="0" y="4" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="10" fill="#FDE047" text-anchor="middle" letter-spacing="1">
      SPIN
    </text>

    <!-- Golden Pointer Arrow at Top (Pointing Down into the wheel) -->
    <g transform="translate(0, -74)" filter="url(#spin_shadow)">
      <polygon points="0,14 -10,-10 10,-10" fill="url(#pointer_gold)" stroke="#FDE047" stroke-width="2"/>
      <circle cx="0" cy="-6" r="3.5" fill="#FEF08A"/>
    </g>
  </g>

  <!-- Bottom Title Badge -->
  <g transform="translate(30, 186)" filter="url(#spin_shadow)">
    <rect width="340" height="42" rx="21" fill="#1E1B4B" stroke="#A855F7" stroke-width="2"/>
    <text x="170" y="27" font-family="Arial Black, Orbitron, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      SPIN WHEEL <tspan fill="#FDE047">৮০০০💎 বোনাস</tspan>
    </text>
  </g>

  <!-- Subtitles -->
  <text x="200" y="255" font-family="Segoe UI, Hind Siliguri, sans-serif" font-weight="900" font-size="14" fill="#C084FC" text-anchor="middle">
    🎡 ভিআইপি ওয়েলকাম চাকা ঘোরানো অফার
  </text>
  <text x="200" y="278" font-family="Segoe UI, Hind Siliguri, sans-serif" font-weight="700" font-size="12" fill="#FDE047" text-anchor="middle">
    সর্বোচ্চ ৮,০০০💎 পর্যন্ত নিশ্চিত বোনাস রিওয়ার্ড
  </text>
</svg>
