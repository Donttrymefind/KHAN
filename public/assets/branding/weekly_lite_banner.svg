<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="wl_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#042F2E"/>
      <stop offset="50%" stopColor="#0F766E"/>
      <stop offset="100%" stopColor="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#wl_bg)"/>

  <!-- Weekly Lite Card Center -->
  <g transform="translate(120, 60)" filter="drop-shadow(0 15px 30px rgba(20,184,166,0.4))">
    <rect width="160" height="105" rx="14" fill="#134E4A" stroke="#2DD4BF" stroke-width="2.5"/>
    <rect x="10" y="10" width="140" height="26" rx="6" fill="#0D9488"/>
    <text x="80" y="28" font-family="Arial Black, sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">WEEKLY LITE</text>
    <text x="80" y="65" font-family="Arial Black, sans-serif" font-weight="900" font-size="24" fill="#5EEAD4" text-anchor="middle">120💎</text>
    <text x="80" y="90" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF" text-anchor="middle">মাত্র ৩৫ ৳</text>
  </g>

  <text x="200" y="205" font-family="Arial Black, Orbitron, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">WEEKLY LITE (BD)</text>
  <text x="200" y="235" font-family="Segoe UI, sans-serif" font-weight="900" font-size="15" fill="#2DD4BF" text-anchor="middle">উইকলি লাইট পাস (১৬টি প্যাকেজ)</text>
  <text x="200" y="260" font-family="Segoe UI, sans-serif" font-weight="600" font-size="12" fill="#E2E8F0" text-anchor="middle">১x থেকে ৩০x উইকলি লাইট পাস ইনস্ট্যান্ট</text>
</svg>