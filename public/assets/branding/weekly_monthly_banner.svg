<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="wm_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#1E1B4B"/>
      <stop offset="50%" stopColor="#312E81"/>
      <stop offset="100%" stopColor="#0F172A"/>
    </linearGradient>
    <linearGradient id="gold_card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FDE047"/>
      <stop offset="100%" stopColor="#D97706"/>
    </linearGradient>
    <linearGradient id="blue_card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#38BDF8"/>
      <stop offset="100%" stopColor="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#wm_bg)"/>

  <!-- Left Weekly Card -->
  <g transform="translate(60, 65) rotate(-6)" filter="drop-shadow(0 12px 25px rgba(0,0,0,0.5))">
    <rect width="130" height="90" rx="12" fill="url(#blue_card)" stroke="#7DD3FC" stroke-width="2"/>
    <text x="65" y="35" font-family="Arial Black, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">WEEKLY</text>
    <text x="65" y="58" font-family="Segoe UI, sans-serif" font-weight="900" font-size="18" fill="#FDE047" text-anchor="middle">450💎</text>
    <text x="65" y="78" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF" text-anchor="middle">৳ ১৪০</text>
  </g>

  <!-- Right Monthly Card -->
  <g transform="translate(210, 65) rotate(6)" filter="drop-shadow(0 12px 25px rgba(0,0,0,0.5))">
    <rect width="130" height="90" rx="12" fill="url(#gold_card)" stroke="#FEF08A" stroke-width="2"/>
    <text x="65" y="35" font-family="Arial Black, sans-serif" font-weight="900" font-size="14" fill="#1E1B4B" text-anchor="middle">MONTHLY</text>
    <text x="65" y="58" font-family="Segoe UI, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">2600💎</text>
    <text x="65" y="78" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="12" fill="#1E1B4B" text-anchor="middle">৳ ৭৬০</text>
  </g>

  <!-- Crown Icon Center -->
  <g transform="translate(180, 45)" filter="drop-shadow(0 4px 10px rgba(253,224,71,0.6))">
    <circle cx="20" cy="20" r="18" fill="#FDE047"/>
    <path d="M12 25h16l2-10-6 4-4-6-4 6-6-4 2 10z" fill="#78350F"/>
  </g>

  <text x="200" y="200" font-family="Arial Black, Orbitron, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">WEEKLY &amp; MONTHLY</text>
  <text x="200" y="230" font-family="Segoe UI, sans-serif" font-weight="900" font-size="15" fill="#FDE047" text-anchor="middle">উইকলি ১৪০ ৳ • মান্থলি ৭৬০ ৳</text>
  <text x="200" y="258" font-family="Segoe UI, sans-serif" font-weight="700" font-size="12" fill="#93C5FD" text-anchor="middle">উইকলি+মান্থলি কম্বো ও মাল্টিপল প্যাকেজ</text>
</svg>